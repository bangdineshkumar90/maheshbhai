<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel - Maheshbhai Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="CSS/style.css">

  <style>
    .admin-container {
      max-width: 900px;
      margin: auto;
    }

    .form-box {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 30px;
    }

    .form-box input {
      margin: 5px;
      padding: 8px;
      width: 160px;
    }

    .product-box {
      background: #222;
      padding: 15px;
      border-radius: 10px;
      margin: 15px 0;
    }

    .delete-btn { background: crimson; color: white; }
    .update-btn { background: dodgerblue; color: white; }
    .add-btn { background: gold; }
  </style>
</head>

<body>

<div class="admin-container">

<h2 style="color:gold;">Admin Dashboard</h2>

<div class="form-box">
  <input type="text" id="name" placeholder="Product Name">
  <input type="number" id="price" placeholder="Price">
  <input type="number" id="discount" placeholder="Discount Price">
  <input type="number" id="stock" placeholder="Stock Quantity">
  <input type="text" id="category" placeholder="Category">
  <input type="text" id="image" placeholder="Image file name (ganpati.jpg)">
  <label>
    Offer <input type="checkbox" id="offer">
  </label>
  <br>
  <button class="add-btn" onclick="addProduct()">Add Product</button>
</div>

<hr>

<h3>All Products</h3>
<div id="product-list"></div>

</div>

<script type="module">

import { db } from "./js/firebase-config.js";
import { auth } from "./js/firebase-config.js";

import {
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const ADMIN_EMAIL = "bangdineshkumar90@gmail.com";

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "admin-login.html";
    return;
  }

  if (user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
    alert("Access Denied");
    window.location.href = "admin-login.html";
  }
});

// ➕ Add Product (NOW WITH STOCK)
window.addProduct = async function () {

  const stockValue = Number(document.getElementById("stock").value);

  await addDoc(collection(db, "products"), {
    name: document.getElementById("name").value,
    price: Number(document.getElementById("price").value),
    discountPrice: Number(document.getElementById("discount").value),
    stock: stockValue || 0,
    category: document.getElementById("category").value || "General",
    image: document.getElementById("image").value,
    offer: document.getElementById("offer").checked,
    createdAt: new Date()
  });

  alert("Product Added!");
  location.reload();
};

// 📦 Load Products
async function loadProducts() {
  const snapshot = await getDocs(collection(db, "products"));
  const container = document.getElementById("product-list");
  container.innerHTML = "";

  snapshot.forEach((docSnap) => {
    const data = docSnap.data();
    const id = docSnap.id;

    const stockValue = Number(data.stock || 0);

    container.innerHTML += `
      <div class="product-box">
        <h4>${data.name}</h4>
        <p>Price: ₹${data.price}</p>
        <p>Discount: ₹${data.discountPrice}</p>
        <p>Stock: 
          <input type="number" value="${stockValue}" 
          onchange="updateStock('${id}', this.value)">
        </p>
        <p>Category: ${data.category || "General"}</p>
        <p>Offer: ${data.offer ? "Yes" : "No"}</p>

        <button class="delete-btn" onclick="deleteProduct('${id}')">
          Delete
        </button>

        <button class="update-btn" onclick="toggleOffer('${id}', ${!data.offer})">
          Toggle Offer
        </button>
      </div>
    `;
  });
}

// ❌ Delete Product
window.deleteProduct = async function (id) {
  await deleteDoc(doc(db, "products", id));
  loadProducts();
};

// 🔄 Toggle Offer
window.toggleOffer = async function (id, value) {
  await updateDoc(doc(db, "products", id), {
    offer: value
  });
  loadProducts();
};

// 🔢 Update Stock
window.updateStock = async function (id, value) {
  await updateDoc(doc(db, "products", id), {
    stock: Number(value)
  });
};

loadProducts();

</script>

</body>
</html>
